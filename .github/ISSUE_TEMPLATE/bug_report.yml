name: Bug report
description: Report something wgfetch does wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        **Do not report security vulnerabilities here.** Follow
        [SECURITY.md](https://github.com/dennispayne/astrostack-downloader/blob/main/SECURITY.md)
        and use private vulnerability reporting instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I have redacted any API keys or tokens from the output I am pasting.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command line you ran.
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output or logs
      description: Relevant log, error or `--json` output, with secrets redacted.
      render: shell

  - type: input
    id: version
    attributes:
      label: wgfetch version
      description: Output of `wgfetch --version`, or the commit SHA you built from.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11 24H2 (x64)
    validations:
      required: true
