name: build

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    # Weekly live-network run to catch recipe rot and upstream drift.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  test:
    name: Build and hermetic tests
    runs-on: ubuntu-latest
    # Skip while a PR is still a draft (e.g. an agent's blank tracking PR that's about to receive
    # many incremental pushes); still runs for push/schedule/workflow_dispatch, and fires once the
    # PR is marked ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore wgfetch.slnx

      - name: Build
        run: dotnet build wgfetch.slnx -c Release --no-restore

      # The hermetic suite must pass with zero network access and zero model files present.
      - name: Test with coverage
        run: >
          dotnet test wgfetch.slnx -c Release --no-build
          --filter "Category!=Live&Category!=Weights"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --settings coverlet.runsettings

      - name: Enforce line coverage threshold
        shell: bash
        run: ./scripts/check-coverage.sh TestResults 85

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  mutation:
    name: Mutation testing (Stryker.NET)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      # stryker-config.json restricts mutation to the verification gate, the download/atomic-rename
      # path and the version comparator, and fails the build below the configured threshold.
      - name: Run Stryker
        run: dotnet tool run dotnet-stryker -- --config-file stryker-config.json

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: StrykerOutput/**/reports/**
          if-no-files-found: warn

  aot:
    name: NativeAOT publish and smoke test
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish portable ZIP
        shell: pwsh
        run: ./scripts/publish.ps1 -Configuration Release

      # Startup, --help, --json shape and exit codes must survive AOT trimming.
      - name: NativeAOT smoke tests
        shell: pwsh
        env:
          WGFETCH_AOT_BINARY: ${{ github.workspace }}\artifacts\publish\win-x64\wgfetch.exe
        run: dotnet test wgfetch.slnx -c Release --filter "Category=Aot"

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: wgfetch-win-x64
          path: artifacts/*.zip
          if-no-files-found: error

  live:
    name: Live-network tier (recipe rot)
    runs-on: ubuntu-latest
    # Scheduled/manual only: failures here mean "upstream changed", not "the code is broken".
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Live tests
        run: dotnet test wgfetch.slnx -c Release --filter "Category=Live"

  reference-hardware:
    name: Reference hardware approximation (no AVX2, 4 cores, 8GB RAM)
    runs-on: ubuntu-latest
    needs: test
    # Scheduled/manual only, like the live and weights tiers: this approximates ISA/core/RAM
    # compatibility, not wall-clock performance on real N5105-class hardware.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
      options: --cpus=4 --memory=8g
    steps:
      - uses: actions/checkout@v7

      - name: Confirm CPU and memory limits
        id: limits
        shell: bash
        run: |
          set -euo pipefail
          cpu_max="$(cat /sys/fs/cgroup/cpu.max)"
          quota="${cpu_max%% *}"
          period="${cpu_max##* }"
          if [ "$quota" = "max" ]; then
            echo "::error::CPU quota is unlimited (expected --cpus=4)."
            exit 1
          fi
          cpu_limit="$(awk -v q="$quota" -v p="$period" 'BEGIN { printf "%.2f", q / p }')"
          awk -v limit="$cpu_limit" 'BEGIN { if (limit > 4.01) exit 1 }' || {
            echo "::error::CPU limit is ${cpu_limit}, expected <= 4.00"
            exit 1
          }

          memory_max_bytes="$(cat /sys/fs/cgroup/memory.max)"
          if [ "$memory_max_bytes" = "max" ]; then
            echo "::error::Memory limit is unlimited (expected --memory=8g)."
            exit 1
          fi
          if [ "$memory_max_bytes" -gt 8589934592 ]; then
            echo "::error::Memory limit is ${memory_max_bytes} bytes, expected <= 8589934592 (8 GiB)."
            exit 1
          fi

          echo "nproc=$(nproc)" >> "$GITHUB_OUTPUT"
          echo "cpu_limit=${cpu_limit}" >> "$GITHUB_OUTPUT"
          echo "memory_max_bytes=${memory_max_bytes}" >> "$GITHUB_OUTPUT"

      - name: Install Intel SDE prerequisites
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils
          rm -rf /var/lib/apt/lists/*

      - name: Download Intel SDE (Linux)
        id: sde
        shell: bash
        run: |
          set -euo pipefail
          page_url="https://www.intel.com/content/www/us/en/download/684897/intel-software-development-emulator.html"
          sde_url="$(curl -fsSL "$page_url" | grep -Po 'https://downloadmirror.intel.com/[^" ]*lin\.tar\.xz' | head -n1)"
          if [ -z "$sde_url" ]; then
            echo "::error::Unable to discover Intel SDE Linux tarball URL from ${page_url}."
            exit 1
          fi

          curl -fsSL "$sde_url" -o /tmp/intel-sde.tar.xz
          tar -xf /tmp/intel-sde.tar.xz -C /tmp

          sde_bin="$(find /tmp -type f -name sde64 | head -n1)"
          if [ -z "$sde_bin" ]; then
            echo "::error::Downloaded Intel SDE archive did not contain sde64."
            exit 1
          fi

          chmod +x "$sde_bin"
          echo "sde_url=${sde_url}" >> "$GITHUB_OUTPUT"
          echo "SDE_BIN=${sde_bin}" >> "$GITHUB_ENV"

      - name: Publish NativeAOT Linux binary
        shell: bash
        run: |
          dotnet publish src/WgFetch.Cli/WgFetch.Cli.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishAot=true \
            -o artifacts/publish/linux-x64
          binary="${GITHUB_WORKSPACE}/artifacts/publish/linux-x64/wgfetch"
          test -x "$binary"
          echo "WGFETCH_PUBLISHED_BINARY=${binary}" >> "$GITHUB_ENV"

      - name: Create Intel SDE launcher wrapper
        shell: bash
        run: |
          cat > /tmp/wgfetch-under-sde <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec "${SDE_BIN}" -nhm -- "${WGFETCH_PUBLISHED_BINARY}" "$@"
          EOF
          chmod +x /tmp/wgfetch-under-sde
          echo "WGFETCH_AOT_BINARY=/tmp/wgfetch-under-sde" >> "$GITHUB_ENV"

      - name: NativeAOT smoke tests under Intel SDE
        id: aot-sde
        run: dotnet test wgfetch.slnx -c Release --filter "Category=Aot"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          case "${{ steps.aot-sde.outcome }}" in
            success) sde_status="✅ pass"; sde_note="published Linux NativeAOT binary executed under Intel SDE (-nhm)" ;;
            failure) sde_status="❌ fail"; sde_note="see 'NativeAOT smoke tests under Intel SDE' step logs" ;;
            *)       sde_status="⏭️ skipped"; sde_note="smoke tests did not run" ;;
          esac
          {
            echo "## Reference hardware approximation"
            echo
            echo "| Check | Status | Note |"
            echo "|---|---|---|"
            echo "| CPU quota | ✅ | \`--cpus=4\`, cgroup limit=${{ steps.limits.outputs.cpu_limit }}, nproc=${{ steps.limits.outputs.nproc }} |"
            echo "| Memory ceiling | ✅ | \`--memory=8g\`, cgroup memory.max=${{ steps.limits.outputs.memory_max_bytes }} bytes |"
            echo "| No-AVX2 execution | ${sde_status} | ${sde_note}; Intel SDE: ${{ steps.sde.outputs.sde_url }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  weights:
    name: Pinned model weights (real download, digest re-verified)
    runs-on: ubuntu-latest
    # Scheduled/manual only, like the live tier: this pulls ~2.8 GB from Hugging Face. Unlike `live`
    # it is NOT continue-on-error — a digest mismatch means the bytes behind a pinned URL changed, and
    # that must fail loudly rather than being logged and shrugged off.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    env:
      # Gitignored (see .gitignore: `models/`), so weights never enter the tracked tree.
      WGFETCH_MODELS_DIR: ${{ github.workspace }}/models
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Restore-only here, with an explicit save at the end, so a run that fails verification can
      # never poison the cache with bad bytes. The key is the content hash of the pin file itself:
      # change a URL, a digest or a revision and the cache is correctly invalidated.
      - name: Restore cached weights
        id: weights-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.WGFETCH_MODELS_DIR }}
          key: weights-${{ runner.os }}-${{ hashFiles('src/WgFetch.Core/Prereqs/PinnedModels.cs') }}

      - name: Build
        run: dotnet build wgfetch.slnx -c Release

      # Re-hashes any file already restored from cache and re-downloads only what does not match, so a
      # cache hit still proves the bytes are the pinned ones.
      - name: Install pinned models
        run: >
          dotnet run --project src/WgFetch.Cli/WgFetch.Cli.csproj -c Release --no-build --
          prereqs install --include-llm --models-dir "$WGFETCH_MODELS_DIR"

      # Independent second pass: reads every file back off disk, recomputes SHA256 and compares it to
      # the digest compiled into the binary. Exits non-zero unless every asset reports `Present`.
      - name: Re-verify every pinned digest
        id: verify
        run: >
          dotnet run --project src/WgFetch.Cli/WgFetch.Cli.csproj -c Release --no-build --
          prereqs status --models-dir "$WGFETCH_MODELS_DIR"

      # The weights are large, licensed upstream artifacts: they must never be committed and never be
      # published as a build artifact. This asserts the first half mechanically.
      - name: Assert no weights landed in the tracked tree
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::prereqs install dirtied the working tree:"
            git status --porcelain
            exit 1
          fi
          git check-ignore -q "models/" || { echo "::error::models/ is not gitignored"; exit 1; }
          echo "Working tree clean; models/ is gitignored."

      - name: Save weights cache
        if: steps.verify.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.WGFETCH_MODELS_DIR }}
          key: weights-${{ runner.os }}-${{ hashFiles('src/WgFetch.Core/Prereqs/PinnedModels.cs') }}

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          case "${{ steps.verify.outcome }}" in
            success) status="✅ verified"; note="every pinned SHA256 matched the downloaded bytes" ;;
            failure) status="❌ mismatch"; note="a pinned SHA256 did not match — see the \`prereqs status\` step" ;;
            *)       status="⏭️ skipped"; note="verification did not run" ;;
          esac
          {
            echo "## Pinned model weights"
            echo
            echo "| Check | Status | Note |"
            echo "|---|---|---|"
            echo "| Cache | ${{ steps.weights-cache.outputs.cache-hit == 'true' && '♻️ hit' || '⬇️ miss (full download)' }} | keyed on \`PinnedModels.cs\` |"
            echo "| SHA256 re-verification | ${status} | ${note} |"
          } >> "$GITHUB_STEP_SUMMARY"

  rollup:
    name: Build summary (all tiers)
    runs-on: ubuntu-latest
    needs: [test, mutation, aot, live, reference-hardware, weights]
    if: always()
    steps:
      - name: Build rollup summary
        shell: bash
        run: |
          status_icon() {
            case "$1" in
              success)   echo "✅ success" ;;
              failure)   echo "❌ failure" ;;
              cancelled) echo "🚫 cancelled" ;;
              skipped)   echo "⏭️ skipped" ;;
              *)         echo "❓ ${1}" ;;
            esac
          }
          {
            echo "## Build rollup"
            echo
            echo "| Tier | Status |"
            echo "|---|---|"
            echo "| Build and hermetic tests | $(status_icon "${{ needs.test.result }}") |"
            echo "| Mutation testing (Stryker.NET) | $(status_icon "${{ needs.mutation.result }}") |"
            echo "| NativeAOT publish and smoke test | $(status_icon "${{ needs.aot.result }}") |"
            echo "| Live-network tier (recipe rot) | $(status_icon "${{ needs.live.result }}") |"
            echo "| Reference hardware approximation | $(status_icon "${{ needs.reference-hardware.result }}") |"
            echo "| Pinned model weights | $(status_icon "${{ needs.weights.result }}") |"
            echo
            echo "Scheduled/manual-only tiers (live, reference hardware, weights) show ⏭️ skipped on regular pushes and PRs — that is expected, not a failure."
          } >> "$GITHUB_STEP_SUMMARY"
