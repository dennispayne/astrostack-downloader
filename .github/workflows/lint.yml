name: "Lint"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: dotnet format / analyzers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `main` has no .NET solution yet (it arrives via PR #1). Skip cleanly rather than failing
      # CI on a repo with nothing to lint; this activates automatically once a .sln/.slnx lands.
      - name: Check for .NET solution
        id: sln-check
        shell: bash
        run: |
          if git ls-files -- '*.sln' '*.slnx' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET
        if: steps.sln-check.outputs.present == 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        if: steps.sln-check.outputs.present == 'true'
        shell: bash
        run: |
          sln=$(git ls-files -- '*.slnx' '*.sln' | head -n1)
          dotnet restore "$sln"
          echo "sln=$sln" >> "$GITHUB_ENV"

      # Style/formatting only — analyzer warnings surface via the normal build, not here.
      - name: dotnet format --verify-no-changes
        if: steps.sln-check.outputs.present == 'true'
        id: format
        continue-on-error: true
        shell: bash
        run: dotnet format "$sln" --verify-no-changes --verbosity diagnostic

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Lint"
            echo
            if [ "${{ steps.sln-check.outputs.present }}" != "true" ]; then
              echo "| Check | Status | Note |"
              echo "|---|---|---|"
              echo "| dotnet format | ⏭️ skipped | no .sln/.slnx on this branch yet |"
            else
              echo "| Check | Status |"
              echo "|---|---|"
              echo "| dotnet format | ${{ steps.format.outcome == 'success' && '✅ clean' || '❌ formatting issues found' }} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if formatting issues were found
        if: steps.sln-check.outputs.present == 'true' && steps.format.outcome != 'success'
        run: exit 1
